[package]
name = "gamelib-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# `sync` only: the mpsc Receiver inside `StreamingChild`. Core never builds a runtime of its own.
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
serde_json = "1"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
