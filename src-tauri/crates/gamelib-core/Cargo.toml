[package]
name = "gamelib-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# `sync` only: the mpsc Receiver inside `StreamingChild`. Core never builds a runtime of its own.
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
serde_json = "1"
# store.rs keeps a store file's top-level key order (IndexMap) instead of the insertion-ordered map
# feature of serde_json, which would flip key order for every crate in the shell binary. indexmap 2
# is already locked; its `serde` feature lets the map be read and written directly.
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
gamelib-testutil = { path = "../gamelib-testutil" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
