[package]
name = "gamelib-steampoll-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "gamelib-steampoll-cli"
path = "src/main.rs"

[dependencies]
gamelib-steampoll = { path = "../gamelib-steampoll", features = ["testing"] }
gamelib-steamfiles = { path = "../gamelib-steamfiles" }
gamelib-i18n = { path = "../gamelib-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "test-util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
