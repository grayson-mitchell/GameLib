[package]
name = "gamelib-knownfix-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "gamelib-knownfix-cli"
path = "src/main.rs"

[dependencies]
gamelib-core = { path = "../gamelib-core" }
gamelib-engine = { path = "../gamelib-engine" }
gamelib-knownfix = { path = "../gamelib-knownfix" }
gamelib-store = { path = "../gamelib-store" }
# The registry ops run their `reg add` through the wine command core, so the CLI builds one over the fake HOME.
gamelib-wine = { path = "../gamelib-wine" }
serde_json = "1"

[dev-dependencies]
gamelib-testutil = { path = "../gamelib-testutil" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
