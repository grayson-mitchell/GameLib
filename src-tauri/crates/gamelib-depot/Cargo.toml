[package]
name = "gamelib-depot"
version = "0.1.0"
edition = "2021"
# Exception to the README rule (1.77.2): aes 0.9 needs 1.89, cbc/sha1/prost 1.85 (Phase 73-01, operator-approved).
rust-version = "1.89"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
gamelib-steamfiles = { path = "../gamelib-steamfiles" }
aes = "0.9"
cbc = "0.2"
sha1 = "0.11"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
