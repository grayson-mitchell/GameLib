[package]
name = "gamelib-launch-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "gamelib-launch-cli"
path = "src/main.rs"

[dependencies]
gamelib-core = { path = "../gamelib-core" }
gamelib-engine = { path = "../gamelib-engine" }
gamelib-knownfix = { path = "../gamelib-knownfix" }
gamelib-launch = { path = "../gamelib-launch" }
gamelib-store = { path = "../gamelib-store" }
gamelib-wine = { path = "../gamelib-wine" }
serde_json = "1"

[dev-dependencies]
gamelib-testutil = { path = "../gamelib-testutil" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
