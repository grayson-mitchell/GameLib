[package]
name = "gamelib-steamcm"
version = "0.1.0"
edition = "2021"
# Exception to the README rule (1.77.2), same as gamelib-depot: steam-vent needs 1.88 and edition-2024 deps (Phase 79-01).
rust-version = "1.89"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
gamelib-steamfiles = { path = "../gamelib-steamfiles" }
# Phase 83 (D-08): the mac-owned helper is spawned as a gamelib-proc Helper.
gamelib-proc = { path = "../gamelib-proc" }
# CF-02: pinned by git rev, never a branch. Codeberg main 767481ad carries the anonymous-logon fix that
# crates.io 0.5.x lacks; revisit when steam-vent 0.6.0 is published.
steam-vent = { git = "https://codeberg.org/steam-vent/steam-vent", rev = "767481ad4eb91dd73f1c70bea6b15f8123a0a040" }
steam-vent-proto = "0.5.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rsa = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
