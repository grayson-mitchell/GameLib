[package]
name = "gamelib-steamfiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
