[package]
name = "gamelib-log"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Tauri-free native log writer (Phase 84, FND-05): GameLib's own port of log_writer.ts, not
# tracing-appender / log4rs / tauri-plugin-log (D-17). It reads no env: the log dir, user-data dir,
# clock and timezone source are injected through `LogConfig`.
gamelib-core = { path = "../gamelib-core" }
serde = { version = "1", features = ["derive"] }
# Default features only. serde_json's insertion-ordered map feature must stay off: Cargo feature
# unification would turn it on for every crate in the shell binary and flip JSON key order there.
serde_json = "1"
# Only for the local UTC offset at a given instant (`SystemTz`). Replaced chrono (RUSTSEC-2026-0543,
# unmaintained). `tzdb-zoneinfo` reads the Unix zoneinfo database; `tzdb-bundle-platform` embeds the
# tz database only on platforms without one (Windows).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
# Crate-diagnostic bridges (D-16, D-17, D-19): one process-wide tracing `Registry` carrying a
# `LogLayer`, and a `log::Log` bridge for crates (reqwest) that emit through `log`. Default features
# off keeps `tracing-log` out of the lockfile; only the `registry` feature (sharded-slab,
# thread_local) is needed to give spans real ids.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
gamelib-testutil = { path = "../gamelib-testutil" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
