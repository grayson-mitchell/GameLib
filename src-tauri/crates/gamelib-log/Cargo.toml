[package]
name = "gamelib-log"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Tauri-free native log writer (Phase 84, FND-05): GameLib's own port of log_writer.ts, not
# tracing-appender / log4rs / tauri-plugin-log (D-17). It reads no env: the log dir, user-data dir,
# clock and timezone source are injected through `LogConfig`.
gamelib-core = { path = "../gamelib-core" }
serde = { version = "1", features = ["derive"] }
# Default features only. serde_json's insertion-ordered map feature must stay off: Cargo feature
# unification would turn it on for every crate in the shell binary and flip JSON key order there.
serde_json = "1"
# `clock` is only for the local UTC offset at a given instant (`SystemTz`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
gamelib-testutil = { path = "../gamelib-testutil" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
