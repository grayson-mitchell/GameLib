[package]
name = "gamelib-engine-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "gamelib-engine-cli"
path = "src/main.rs"

[dependencies]
gamelib-core = { path = "../gamelib-core" }
gamelib-engine = { path = "../gamelib-engine", features = ["testing"] }
gamelib-store = { path = "../gamelib-store" }
serde_json = "1"

[dev-dependencies]
gamelib-testutil = { path = "../gamelib-testutil" }
tempfile = "3"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
