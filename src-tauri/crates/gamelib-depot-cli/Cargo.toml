[package]
name = "gamelib-depot-cli"
version = "0.1.0"
edition = "2021"
# Exception to the README rule (1.77.2): follows gamelib-depot (Phase 73-01, operator-approved).
rust-version = "1.89"
publish = false

[[bin]]
name = "gamelib-depot-cli"
path = "src/main.rs"

[dependencies]
gamelib-depot = { path = "../gamelib-depot" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
