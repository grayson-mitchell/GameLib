[package]
name = "gamelib-depot-cli"
version = "0.1.0"
edition = "2021"
# Exception to the README rule (1.77.2): follows gamelib-depot (Phase 73-01, operator-approved).
rust-version = "1.89"
publish = false

[[bin]]
name = "gamelib-depot-cli"
path = "src/main.rs"

[dependencies]
gamelib-depot = { path = "../gamelib-depot" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# The CLI test reuses the gamelib-depot fixture builder + fake CDN (tests/support), which need these.
aes = "0.9"
cbc = "0.2"
zstd = "0.14"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
prost = "0.14"
sha1 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
