[package]
name = "gamelib-launch"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Tauri-free launch services (Phase 88, SVC-03): the launch builders, the runner spawn, the funnel and
# re-adoption (88.1 to 88.3). No `tauri`, no `keyring`, no environment reads. May depend on
# `gamelib-engine`, `gamelib-wine` and `gamelib-knownfix`; none of them ever depends on this crate.
gamelib-engine = { path = "../gamelib-engine" }
gamelib-wine = { path = "../gamelib-wine" }
gamelib-knownfix = { path = "../gamelib-knownfix" }
gamelib-core = { path = "../gamelib-core" }
# The system-information read and the anti-cheat lookup the prepare step logs (88.1-11, D-24), in process.
# `gamelib-info` is a leaf: it never depends on this crate (proved with `cargo tree -p gamelib-info`).
gamelib-info = { path = "../gamelib-info" }
# The spawn seam (`SpawnClass::Helper` children, kill-on-close, the reaper) the runner's children go through
# (88.2-07). Workspace crate, already in the lockfile.
gamelib-proc = { path = "../gamelib-proc" }
# The log entry types and the typed-target conversion the runner's log hand-off uses (88.2-07).
gamelib-log = { path = "../gamelib-log" }
# Same feature set as the wine crate (the shell calls `dispatch_sync` from plain worker threads).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util"] }
# The `Shutdown` token type; the version gamelib-core already locks.
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Test seams: the known-fix crate's (and through it the engine's and wine's) scripted fakes.
testing = ["gamelib-knownfix/testing"]

[dev-dependencies]
gamelib-launch = { path = ".", features = ["testing"] }
# The unit tests build an `EngineCtx` over a `StoreHost`, as the CLI does.
gamelib-store = { path = "../gamelib-store" }
gamelib-testutil = { path = "../gamelib-testutil" }
tempfile = "3"
# The English catalogue the Epic offline notification resolves through (the replay compares its real text).
gamelib-i18n = { path = "../gamelib-i18n" }
# Pitfall 12: the Rust shlex crate disagrees with npm shlex 2.1.2 on recorded vectors (an unterminated
# quote is `None` rather than a typed error, `#` starts a comment, join quotes differently), so the
# builders carry a port of the npm lexer and this crate is the differential reference in a unit test.
shlex = "2"
# The tree snapshot of the prepare_wine replay hashes files the way the TS snapshot does. Already locked
# (gamelib-engine, gamelib-wine and gamelib-knownfix hash with it), so no new crate enters the tree.
sha2 = "0.10"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
