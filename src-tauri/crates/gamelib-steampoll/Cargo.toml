[package]
name = "gamelib-steampoll"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
gamelib-core = { path = "../gamelib-core" }
gamelib-steamfiles = { path = "../gamelib-steamfiles" }
gamelib-i18n = { path = "../gamelib-i18n" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "macros", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# running_scan.rs calls libproc (proc_listallpids, proc_pidpath) directly. libc is already resolved
# in Cargo.lock at this version (the shell crate declares it), so no new crate enters the tree: the
# same "declare what your own code calls" discipline as src-tauri/Cargo.toml's libc comment.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"

# win_live.rs reads steam.exe's cumulative I/O write counter (GetProcessIoCounters) and finds the
# process by image name (a ToolHelp snapshot): no child process, no new crate. windows-sys 0.61 is
# already resolved in Cargo.lock for gamelib-steamfiles and gamelib-depot; Windows-target-gated, so
# macOS and Linux builds never see it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[features]
# RecordingHost / ScriptedRunner / FakeClock for the parity harness and the CLI replay runner.
testing = []

[dev-dependencies]
gamelib-steampoll = { path = ".", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
