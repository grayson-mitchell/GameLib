[package]
name = "gamelib-steampoll"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
gamelib-steamfiles = { path = "../gamelib-steamfiles" }
gamelib-i18n = { path = "../gamelib-i18n" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "macros", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# RecordingHost / ScriptedRunner / FakeClock for the parity harness and the CLI replay runner.
testing = []

[dev-dependencies]
gamelib-steampoll = { path = ".", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
