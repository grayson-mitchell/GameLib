<!doctype html>
<!--
  About page for GameLib's Tauri child window (Phase 34.1 Plan 07, D-12).

  Fully static: no bundler entry, no imports, no network requests. The version is the
  only dynamic value, and it arrives via the `v` query param (see tauriChildWindows.ts's
  `tauriShowAboutWindow`) rather than any IPC or Tauri capability -- this window has NO
  Tauri command access (fail-closed by window label, src-tauri/capabilities/default.json).
  The website is plain text, not a link: this window cannot open external URLs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>About GameLib</title>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #1a1a1a;
        color: #e6e6e6;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      p {
        margin: 2px 0;
        font-size: 13px;
        color: #b3b3b3;
      }
    </style>
  </head>
  <body>
    <img src="./icon.png" alt="GameLib" />
    <h1>GameLib</h1>
    <p id="version">Version: unknown</p>
    <p>License: GPL V3</p>
    <p>https://github.com/grayson-mitchell/GameLib</p>
    <script>
      ;(function () {
        var params = new URLSearchParams(location.search)
        var version = params.get('v') || 'unknown'
        document.getElementById('version').textContent = 'Version: ' + version
      })()
    </script>
  </body>
</html>
