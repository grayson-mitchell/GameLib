appId: com.gamelib.app
productName: GameLib
files:
  - build/**/*
  - node_modules/**/*
  - '!build/bin/*'
  - build/bin/legendary.LICENSE

asarUnpack:
  - build/icon.png
  - build/icon.icns
  - build/mac-icon.icns
  - build/win_icon.ico
  - build/icon-tray-dark.png
  - build/icon-tray-light.png
  - build/bin/**/*
  - '!build/bin/legendary.LICENSE'

protocols:
  - name: gamelib
    schemes:
      - gamelib

# Auto-update feed for electron-updater. Without this, electron-builder derives
# the feed from package.json's `repository` field, which still points at Heroic
# upstream (Heroic 2.x > GameLib 0.x always triggers a bogus "update available"
# popup that downloads Heroic's installer). Point it at the GameLib fork instead.
publish:
  provider: github
  owner: grayson-mitchell
  repo: GameLib

win:
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}
  icon: build/win_icon.ico
  target:
    - nsis
  files:
    - build/bin/${arch}/win32/*
    - build/bin/x64/win32/nile.exe
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

portable:
  artifactName: ${productName}-${version}-Portable-${arch}.${ext}

mac:
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  category: public.app-category.games
  icon: build/mac-icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    com.apple.security.cs.allow-jit: true
  # legendary/gogdl/nile ship as PyInstaller --onedir trees on macOS ONLY
  # (Phase 34.9) -- the recursive glob below reaches every file nested
  # inside those trees. Windows and Linux deliberately stay flat (see
  # win.files/linux.files below) because the amfid per-file Gatekeeper tax
  # that motivated onedir is macOS-specific. A nested tree landing inside
  # app.asar.unpacked must not be trusted just because the build succeeded
  # -- electron-builder issue #3940 documents nested binaries silently
  # skipped by signing.
  #
  # Phase 34.18 retired the macOS x64 (Intel) CI leg: `macos-13` was retired
  # by GitHub 2025-12-04 and never got a replacement runner across three
  # attempts (F-34.16-G). macOS is now arm64-only, so a single
  # `pnpm verify:runner-bundle build --arch=arm64` step runs automatically
  # as a `&&` step of both `dist:mac` and `release:mac`, immediately before
  # `electron-builder` -- a malformed framework (F-34.9-01) in the staged
  # tree aborts the build before packaging. What it inspects is the STAGED
  # `build/` tree, not the packaged `.app`: electron-builder's own copy into
  # `app.asar.unpacked` is verified by the blocking live gate
  # (`34.9-LIVE-GATE-RERUN.md` scored item 2) and by manual invocation
  # against a built app, not automatically. A deliberate consequence: because
  # the guard runs before packaging, `dist:mac` and `release:mac` fail fast
  # on a macOS checkout that has no staged `build/bin/arm64/darwin` tree --
  # `verifyRunnerBundle` throws naming the root and arch. This is intended:
  # an app packaged without its runners is broken either way. Recovery is
  # `pnpm download-helper-binaries`, which as of 2026-08-27 DOES supply them:
  # the three arm64 onedir slots in meta/runnersOnedirDigests.json hold real
  # sha256 digests pinned from run 33047720816 (Phase 34.18 plan 34.18-07's
  # developer gate), so the fetch exits 0 on darwin instead of throwing on a
  # PENDING-CI-PUBLISH sentinel.
  files:
    - build/bin/${arch}/darwin/*
    - build/bin/${arch}/darwin/**/*
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

dmg:
  background: public/dmg.png
  window:
    width: 600
    height: 500
  contents:
    - x: 10
      y: 215
      type: file
    - x: 420
      y: 215
      type: link
      path: /Applications

linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Game
  icon: build/icon.icns
  desktop:
    entry:
      Name: GameLib
      Comment[de]: Ein OSS-Spielelauncher für GOG, Epic Games und Amazon Games
      Comment[pl]: Otwartoźródłowy launcher dla GOG, Epic Games i Amazon Games
      Comment[fr]: Un lanceur de jeux open source pour GOG, Epic Games et Amazon Games
      Comment[es]: Un lanzador de juegos de código abierto para GOG, Epic Games
      Comment[it]: Un launcher open source per GOG, Epic Games e Amazon Games
      Comment[ru]: Открытый лаунчер для GOG, Epic Games и Amazon
      Comment[zh_CN]: 一个用于GOG、Epic Games和Amazon Games的开源游戏启动器
      Comment[pt]: Um lançador de jogos de código aberto para GOG, Epic Games e Amazon Games
      Comment[pt_BR]: Um lançador de jogos de código aberto para GOG, Epic Games e Amazon Games
      Comment[ja]: GOG、Epic Games、Amazon Gamesのためのオープンソースランチャー
      Comment: An Open Source Launcher for GOG, Epic Games, Amazon Games, and Steam
  files:
    - build/bin/${arch}/linux/*
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe

rpm:
  fpm: ['--rpm-rpmbuild-define', '_build_id_links none']

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
