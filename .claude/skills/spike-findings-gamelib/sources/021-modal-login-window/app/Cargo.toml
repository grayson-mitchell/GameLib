[package]
name = "spike-021-modal-login"
version = "0.0.0"
description = "Spike 021 harness — modal/child/sheet login-window attachment probes."
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Features deliberately MATCH src-tauri/Cargo.toml so the shared CARGO_TARGET_DIR
# reuses the project's already-compiled artifacts.
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Same pinned versions + feature lists as src-tauri/Cargo.toml (see its supply-chain
# rationale comments) so nothing new compiles beyond the spike crate itself.
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSView",
    "NSWindow",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSResponder",
    "NSTextField",
    "block2",
] }
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "WKWebsiteDataRecord",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKNavigationAction",
    "WKUIDelegate",
    "WKFrameInfo",
    "WKWindowFeatures",
    "WKHTTPCookieStore",
    "objc2-app-kit",
] }
