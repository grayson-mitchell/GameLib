[package]
name = "spike-019-dummy-oauth-store"
version = "0.0.0"
description = "Spike 019 harness — Tauri login window driving a local OAuth 2.0 auth-code-grant DummyStore."
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Features deliberately MATCH src-tauri/Cargo.toml so the shared CARGO_TARGET_DIR
# reuses the project's already-compiled `tauri` artifact instead of rebuilding it.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
