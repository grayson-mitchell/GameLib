[package]
name = "spike-072-signin"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
steam-vent = { git = "https://codeberg.org/steam-vent/steam-vent", rev = "a9e8164ccd8a7b537da59a652093b0318f416105" }
steam-vent-proto = "0.5.2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.13", features = ["form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures-util = "0.3"
