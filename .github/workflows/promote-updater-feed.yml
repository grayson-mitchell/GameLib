# Promote updater feed: copies the just-published release's `latest.json`
# manifest to a fixed-tag release (`updater`) so tauri-plugin-updater's feed
# endpoint has somewhere stable and real to resolve.
#
# Why not `/releases/latest/download/latest.json`: GitHub's `/releases/latest`
# resolves ONLY to the newest NON-prerelease, NON-draft release. D-09
# (34-CONTEXT.md) locks `prerelease: true` on every release release-tauri.yml
# creates -- that flag encodes the Phase 19 "prerelease-not-Latest" lesson (a
# 0.x prerelease must never become GitHub "Latest"). Combined, those two facts
# mean the `/latest/` endpoint form is a PERMANENT 404, before and after
# manual publish. Dropping `prerelease: true` to fix this is a FORECLOSED
# remedy. Instead the endpoint moves to a stable, non-`/latest/` asset
# location (`/releases/download/updater/latest.json`), and this workflow is
# the mechanism that keeps that location current.
#
# Promotion happens only after a human publishes the draft release
# (`release: types: [published]`) -- this IS the D-09 human-review gate,
# preserved rather than worked around. Before publish, the updater keeps
# seeing the previous version's manifest, exactly as intended. Publishing is
# also the point at which `latest.json`'s own per-platform installer URLs
# (which point at the versioned release's assets) first become publicly
# resolvable, since a draft release's assets are not public.
#
# UNPROVEN LIVE: this workflow has never run against a real publish event.
# It is intended to be exercised as part of 34-07's deferred `v*` tag-push
# live gate -- treat every claim above as an invariant this workflow is
# designed to uphold, not something observed on a real runner.
name: Promote updater feed

on:
  release:
    types: [published]

concurrency:
  group: promote-updater-feed
  cancel-in-progress: false

jobs:
  promote:
    # Guards against this workflow re-triggering itself: `gh release create
    # updater` below itself emits a `release: published` event, but the
    # feed-holder release's tag is `updater`, not `v*`, so this condition
    # excludes it. (GitHub's own rule that events created by the default
    # GITHUB_TOKEN do not trigger further workflow runs is a second,
    # independent guard against the same loop.)
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      # The published release may be an Electron-only release with no
      # Tauri latest.json asset (Pitfall 7: draft-release-mac.yml and
      # draft-release-linux.yml co-run on the same v* tag). That absence is
      # not an error and must never fail the job.
      #
      # WR-07 (gap cycle 2 review): this step used to treat ANY non-zero
      # `gh release download` exit as "nothing to promote" -- an expired
      # token, a 5xx from the API, a secondary rate limit or a transient
      # network fault all landed in the same branch, set found=false, skipped
      # every downstream step, left the job green, and printed a ::notice::
      # asserting a cause that may be false. Since this workflow is the SOLE
      # mechanism keeping /releases/download/updater/latest.json current, a
      # silent failure here pins every installed client to the previous
      # version's manifest with no alarm anywhere. The asset list is now read
      # FIRST: an unreadable release is a hard error, and only a genuinely
      # absent asset takes the skip path.
      #
      # The asset check is a `node` one-liner, not `jq`: this workflow must
      # never gain a jq/sed step (see the signature-integrity note below and
      # tauriConf.test.ts test 7), and node is preinstalled on ubuntu runners.
      # It only READS assets.json -- latest.json itself is never parsed here.
      - name: Download latest.json from the published release
        id: download
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p feed
          if ! gh release view "$TAG" --json assets > assets.json; then
            echo "::error::Could not read the asset list for $TAG -- refusing to assume 'nothing to promote'. The updater feed was NOT updated."
            exit 1
          fi
          ASSET_PRESENT=$(node -e "const assets = require('./assets.json').assets || []; const names = assets.map(function (a) { return a.name }); process.stdout.write(names.includes('latest.json') ? 'yes' : 'no')")
          if [ "$ASSET_PRESENT" = "yes" ]; then
            gh release download "$TAG" --pattern 'latest.json' --dir feed --clobber
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No latest.json asset on $TAG (Electron-only release); nothing to promote"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Purely observational -- the file is never modified, only inspected.
      # Gives an auditable record linking the feed's current contents to the
      # release tag it was copied from.
      - name: Record the manifest checksum (audit trail)
        if: steps.download.outputs.found == 'true'
        shell: bash
        run: sha256sum feed/latest.json

      # `--prerelease` is mandatory here, not optional: it is what keeps this
      # release off GitHub "Latest" (the Phase 19 lesson) while still being
      # PUBLISHED, which is the only way `/releases/download/updater/...`
      # resolves publicly. Never mark the feed-holder release as a draft --
      # a non-published release's assets are not publicly downloadable,
      # which would recreate the exact bug this workflow exists to fix.
      - name: Ensure the feed-holder release exists
        if: steps.download.outputs.found == 'true'
        shell: bash
        run: |
          if ! gh release view updater >/dev/null 2>&1; then
            gh release create updater \
              --title "Updater feed" \
              --notes "Holds latest.json copied verbatim from the most recently published v* release. Not a release of GameLib itself -- do not install from here." \
              --prerelease
          fi

      # Uploaded byte-identical, never regenerated or edited: latest.json's
      # embedded per-platform minisign (Ed25519) signatures are verified
      # client-side by tauri-plugin-updater against the pubkey committed in
      # tauri.conf.json. This workflow declares no updater-signing secret
      # anywhere above and must never gain a jq/sed/redirect step that
      # rewrites the file -- doing so would invalidate every signature it
      # carries. The `node -e` reads below only PARSE the manifest's version
      # field; nothing here ever writes to feed/latest.json.
      #
      # WR-08 (gap cycle 2 review): the only guard used to be the tag_name
      # `v*` prefix check. Because release-tauri.yml creates DRAFT releases
      # held for human review (D-09), several unpublished drafts routinely
      # accumulate -- and publishing them out of order, or publishing a
      # hotfix branch's older tag after a newer one, unconditionally
      # clobbered the feed with an older manifest. tauri-plugin-updater will
      # not INSTALL a downgrade, so the visible symptom is silent: the feed
      # simply stops advertising the newest build until somebody notices and
      # re-publishes. There was also no check that the promoted manifest's
      # own version matches the tag it came from, so a stale latest.json left
      # on a release by a retried run was promoted verbatim.
      #
      # A same-version re-promotion is deliberately ALLOWED (the upload is a
      # byte-identical --clobber, so re-running after a partial upload is
      # safe); only a strict downgrade is refused. The tag/version mismatch
      # is a WARNING rather than a hard failure because a prerelease tag
      # (v0.7.0-rc1) legitimately differs from tauri.conf.json's version.
      - name: Publish the manifest to the stable feed location
        id: publish
        if: steps.download.outputs.found == 'true'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          NEW=$(node -e "process.stdout.write(String(require('./feed/latest.json').version || ''))")
          if [ -z "$NEW" ]; then
            echo "::error::feed/latest.json declares no version -- refusing to promote an unrecognisable manifest"
            exit 1
          fi
          if [ "$NEW" != "${TAG#v}" ]; then
            echo "::warning::the manifest promoted from $TAG declares version $NEW; check this is not a stale asset from a retried run"
          fi
          mkdir -p current
          if gh release download updater --pattern 'latest.json' --dir current --clobber 2>/dev/null; then
            CUR=$(node -e "process.stdout.write(String(require('./current/latest.json').version || ''))")
            NEWEST=$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -1)
            if [ -n "$CUR" ] && [ "$CUR" != "$NEW" ] && [ "$NEWEST" != "$NEW" ]; then
              echo "::warning::Refusing to promote $NEW over the newer feed version $CUR"
              echo "promoted=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          gh release upload updater feed/latest.json --clobber
          echo "promoted=true" >> "$GITHUB_OUTPUT"
