name: Lint
permissions:
  contents: read

on:
  push:
    branches: [main, stable]
    paths-ignore:
      - '.planning/**'
      - '**.md'
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: deps
        uses: ./.github/actions/install-deps
      - name: Lint code.
        run: pnpm lint
      - name: Prettier code.
        run: pnpm prettier
      # Quick 261107-brs: this step is the knip identity ratchet (meta/knipRatchet.cjs against
      # meta/knip-baseline.txt). It fails on a new finding AND on a vanished one; lower
      # meta/knip-baseline.txt in the same commit that removes dead code.
      - name: Find dead code
        run: pnpm find-deadcode
      - name: Module boundaries
        run: pnpm boundaries
      # Phase 65 D-02: shrink-only per-file line ceiling for storeManagers/steam/; lower
      # meta/steamLineCeilingBaseline.json in the same commit as the move.
      - name: Steam file line ceiling
        run: pnpm steam-line-ceiling
      # Phase 66 D-16: shrink-only module-state / child_process / jest.mock ceilings; lower
      # the matching meta/backendDiCeilings/*.json entry in the same commit as the removal.
      # It runs even when an earlier step failed, because from a58e3e3e8 a red `Lint code.`
      # hid ceiling drift (quick 261114-2gg); a failed install still skips it.
      - name: Backend DI ceilings
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm backend-di-ceilings
