name: Rust test
permissions:
  contents: read

on:
  push:
    branches: [main, stable]
    paths-ignore:
      - '.planning/**'
      - '**.md'
    # No positive `paths:` filter on the src-tauri tree, deliberately. This job is meant to become
    # a REQUIRED check (see the todo this closes), and GitHub never reports a status for a workflow
    # its `paths:` filter skipped -- so a PR touching no Rust would sit un-mergeable forever,
    # waiting on a check that never arrives. Do not "optimise" this back in.
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Why this exists: nothing in CI ran `cargo test` or even `cargo check` on any OS. A real compile
# break in src-tauri/src/main.rs's `#[cfg(test)] mod tests` (four `store_embed_wire_contract_*`
# functions calling `#[cfg(target_os = "macos")]`-gated helpers with no matching guard on the test
# functions themselves) sat on `main` unnoticed, because `cargo check` -- the non-test build
# `release-tauri.yml` exercises via `tauri-action` -- was clean the whole time. Only
# `cargo test --bin gamelib-shell` failed, and nothing in CI ever ran it. It was found only when
# Phase 46 research ran the harness by hand on a Windows machine (see
# .planning/todos/completed/2026-09-22-windows-rust-tests-not-run-in-ci.md).
#
# Measured baseline: `cd src-tauri && cargo test --bin gamelib-shell` on this Windows machine,
# 2026-09-23 -- 234 passed; 0 failed; 2 ignored (315 passed as of 2026-10-03). The compile break
# the todo describes is indeed fixed.
#
# CORRECTION, 2026-10-03: the line that used to sit here -- "this job lands green on day one, not
# red" -- was WRONG, and it misled a later reader into believing the remaining red was a
# platform-specific quirk. This job had never passed on ANY run: red on both legs, every time,
# going back at least to 2026-09-30. The baseline above was measured on a developer machine, which
# has a built sidecar sitting in `src-tauri/binaries/` from earlier `pnpm tauri:dev` runs; CI
# checkouts never do, because that path is gitignored as a build artifact. `tauri_build::build()`
# validates `bundle.externalBin` unconditionally, so the build script aborted before a single test
# compiled. Fixed by the placeholder step below. The lesson generalises: a baseline measured in a
# populated working tree does not predict a clean checkout, so do not write "lands green" from a
# local run alone.
#
# Why the vite build is a real step and not overhead: src-tauri/src/main.rs calls
# `tauri::generate_context!()`, which embeds `frontendDist` (`../build/renderer` per
# tauri.conf.json) at COMPILE time. Without that directory the crate does not compile at all --
# tests included. A stub `build/renderer/index.html` was considered and rejected: a fake input
# means a real asset/codegen break would pass this gate and only surface at release time.
#
# What this does NOT catch, stated plainly per this repo's standing rule about gates that appear
# to cover more than they do:
#   (a) The Linux leg (Phase 72 D-14) is compile-only plus provisional tests: `cargo check
#       --all-targets` is a hard gate, `cargo test --bin gamelib-shell` is also a hard gate (green on
#       the first run, 72-01 Task 3), and clippy is NOT run on Linux (no measured ceiling map
#       in meta/clippyRatchet.cjs), so Linux-only cfg code is compiled but never linted.
#   (b) Compile and unit tests only -- no app launch, no webview, no IPC round trip. Anything
#       runtime- or event-loop-ordering-dependent is out of scope here exactly as it is for jest
#       (cf. the `smoke:sidecar` note in test.yml).
#   (c) `dtolnay/rust-toolchain@stable` tracks an unpinned, moving toolchain -- this job can go red
#       from a Rust release with no repo change at all.
#   (d) The 2 `#[ignore]`d tests in the 234-test baseline above still run nowhere, in this job or
#       any other.
#   (e) The sidecar is a placeholder (see the "Placeholder for externalBin" step), so this job proves
#       nothing about the real SEA sidecar or its externalBin naming/packaging -- a sidecar build
#       that stopped emitting `gamelib-sidecar-<triple>` would still pass here and surface only in
#       release-tauri.yml.
#   (g) The Tauri-free crates (gamelib-scan, gamelib-scan-cli, gamelib-depot, gamelib-depot-cli, gamelib-steamfiles, gamelib-steamfiles-cli) are covered only by the
#       explicit `-p` test step and the `--workspace` clippy run: `cargo test --bin gamelib-shell`
#       alone selects only the root package. They run on the Linux leg too (Phase 72 D-14), via
#       the same `-p` test step.
# And: passing here does not make this a "required check" on `main`. That is a GitHub
# branch-protection/ruleset setting under Settings -> Branches, performed by a repo admin, and is
# NOT established by this file.
jobs:
  cargo-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      # Phase 72 D-14: webkit/appindicator/rsvg dev packages so src-tauri compiles on the Linux leg (same list as release-tauri.yml).
      - name: Install Linux system dependencies (Linux leg only, Phase 72 D-14)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: ./.github/actions/install-deps
      - name: Build renderer web assets (vite)
        shell: bash
        run: pnpm exec vite build
      # tauri-build checks every `externalBin` at COMPILE time, so without
      # `src-tauri/binaries/gamelib-sidecar-<host-triple>[.exe]` the crate fails in
      # its build script ("resource path ... doesn't exist") before a single test
      # runs -- which is how this job sat red on both legs from at least
      # 2026-10-01. Built for real, not touched as a placeholder, for the same
      # reason the vite step above is real: a fake input would let a genuine
      # sidecar build break pass this gate and surface only at release time. The
      # host triple is the right one here (no cross-compile), so unlike
      # release-tauri.yml no GAMELIB_SIDECAR_TARGET_TRIPLE is set.
      - name: Build self-contained sidecar (Node SEA) for tauri-build's externalBin check
        shell: bash
        run: pnpm build:sidecar-sea
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: cargo test (gamelib-scan, gamelib-depot and gamelib-steamfiles crates)
        shell: bash
        working-directory: src-tauri
        run: cargo test -p gamelib-scan -p gamelib-scan-cli -p gamelib-depot -p gamelib-depot-cli -p gamelib-steamfiles -p gamelib-steamfiles-cli
      # Phase 73 D-15: the depot codecs (xz2/lzma-sys, zstd, zlib-rs) must be statically linked so the
      # shipped binary needs no system liblzma/zstd/zlib. Fails if the CLI links any of them dynamically.
      - name: static codec linkage (gamelib-depot-cli)
        shell: bash
        working-directory: src-tauri
        run: |
          cargo build -p gamelib-depot-cli
          case "$RUNNER_OS" in
            macOS) LINKS=$(otool -L target/debug/gamelib-depot-cli) ;;
            Linux) LINKS=$(ldd target/debug/gamelib-depot-cli) ;;
            Windows)
              cargo build -p gamelib-scan-cli
              LINKS=$(target/debug/gamelib-scan-cli.exe scan_pe_imported_dlls "{\"exePath\":\"$(pwd -W)/target/debug/gamelib-depot-cli.exe\"}")
              ;;
          esac
          echo "$LINKS"
          if echo "$LINKS" | grep -Ei 'lzma|zstd|libz\.|zlib'; then
            echo "gamelib-depot-cli links a codec library dynamically (D-15)" >&2
            exit 1
          fi
      # `tauri_build::build()` (tauri-build 2.6.3, src/lib.rs:545) copies every
      # `bundle.externalBin` entry UNCONDITIONALLY -- not gated on profile, feature, or whether
      # this is `tauri build` -- and aborts the build script when one is missing. This crate
      # declares `binaries/gamelib-sidecar`, which `src-tauri/binaries/.gitignore` deliberately
      # keeps out of the repo as a CI-built artifact, so it is absent in every checkout and no
      # test ever got to compile.
      #
      # A PLACEHOLDER IS SUFFICIENT HERE, AND THIS IS MEASURED, NOT ASSUMED -- read this before
      # concluding it contradicts the "stub was considered and rejected" note above, because the
      # two cases differ in exactly the way that matters:
      #   * `frontendDist` is EMBEDDED at compile time by `tauri::generate_context!()`. A fake
      #     there would let a real asset/codegen break sail through and only surface at release.
      #     That is why it is built for real, and that decision stands.
      #   * `externalBin` is never embedded, never read by the compiler, and never executed by
      #     these tests -- `tauri_build` only COPIES the file to the target dir. Measured
      #     2026-10-03: with the real 169911968-byte sidecar moved aside and replaced by a
      #     17-byte `#!/bin/sh` stub, `cargo test --bin gamelib-shell` gives 315 passed / 0
      #     failed in 0.06s; with no file at all it reproduces CI's error byte for byte. The
      #     content is irrelevant to this job, so a placeholder removes an unrelated
      #     precondition without weakening anything the job asserts.
      #
      # Building the real sidecar (`pnpm build:sidecar-sea`) was considered and REJECTED: it adds
      # minutes per OS and couples a Rust-compile gate to the SEA pipeline's health (which has its
      # own recorded hazards -- a decode hang and a liblzma version mismatch), letting this job go
      # red for reasons that have nothing to do with Rust. Real sidecar bundling stays
      # release-tauri.yml's job.
      #
      # What this step therefore does NOT buy, stated plainly per this repo's standing rule about
      # gates that look broader than they are: it does not verify that the sidecar BUILDS, nor
      # that `externalBin` resolves to a working binary, on any platform.
      #
      # The name is DERIVED from tauri.conf.json plus `rustc`'s own host triple rather than
      # hardcoded, so renaming the externalBin entry still produces the right placeholder instead
      # of silently stubbing a stale name -- and the step fails loudly if the entry disappears
      # altogether, rather than becoming a quiet no-op.
      - name: Placeholder for externalBin (existence precondition only)
        shell: bash
        working-directory: src-tauri
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          test -n "$triple" || { echo "could not read host triple from rustc -vV" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const triple = process.argv[1];
            const ext = triple.includes("windows") ? ".exe" : "";
            const conf = JSON.parse(fs.readFileSync("tauri.conf.json", "utf-8"));
            const entries = conf.bundle?.externalBin ?? [];
            if (entries.length === 0) {
              throw new Error(
                "tauri.conf.json declares no bundle.externalBin -- this step is stale; delete it rather than letting it silently no-op"
              );
            }
            for (const entry of entries) {
              const target = entry + "-" + triple + ext;
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.writeFileSync(target, "#!/bin/sh\nexit 0\n", { mode: 0o755 });
              console.log("placeholder created: " + target);
            }
          ' "$triple"
      # Phase 72 D-14: hard compile check of every target, so a Linux-only cfg break is reported apart from a test failure.
      - name: cargo check (Tauri shell crate, Linux leg only)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: cargo test (Tauri shell crate)
        shell: bash
        working-directory: src-tauri
        run: cargo test --bin gamelib-shell

      # Both matrix legs run clippy natively. Each leg's host triple equals the triple its ceilings
      # were measured on: macos-latest is aarch64-apple-darwin, as on the measuring Mac, and
      # windows-latest is x86_64-pc-windows-msvc, as on the operator's Windows box (quick
      # 261107-uh4). meta/clippyRatchet.cjs selects ceilings by process.platform, so each leg is
      # held to its own map. Linux-only cfg is still never linted, because there is no Linux leg
      # (caveat (a)).
      #
      # The toolchain is pinned rather than `@stable`: new clippy releases add and re-tune lints,
      # and an equality ceiling would turn main red on a Rust release with no repo change. The pin
      # MUST equal CLIPPY_TOOLCHAIN in meta/clippyRatchet.cjs; bumping it means re-measuring BOTH
      # ceiling maps in the same commit, each natively on its own OS.
      #
      # This install MUST stay AFTER `cargo test`: dtolnay/rust-toolchain makes the toolchain it
      # installs the default, so putting it earlier would silently re-pin the tests too.
      #
      # The ratchet fails on a rise AND on a fall (lower the ceiling in the same commit).
      - name: Install pinned clippy toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - name: cargo clippy ratchet (shrink-only, per-platform baseline)
        if: runner.os != 'Linux'
        shell: bash
        working-directory: src-tauri
        run: |
          cargo +1.99.1 clippy --workspace --all-targets --message-format=json > "$RUNNER_TEMP/clippy.json"
          node ../meta/clippyRatchet.cjs "$RUNNER_TEMP/clippy.json" --list
