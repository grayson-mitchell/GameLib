name: Code check
permissions:
  contents: read

on:
  push:
    branches: [main, stable]
    paths-ignore:
      - '.planning/**'
      - '**.md'
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Check Typescript syntax
        run: pnpm codecheck
      # Phase 67 D-18. Regenerating must not change src-tauri/src/ipc_contract.rs; fix by running
      # `pnpm gen:ipc-contract` and committing the result.
      - name: Check generated IPC contract is fresh
        run: pnpm check:ipc-contract
      # Quick 261107-9lq. steam/ (non-test) is adopted at 0 noUncheckedIndexedAccess
      # sites; every other bucket is an equality ceiling in
      # meta/indexedAccessBaseline.json. Lower a bucket in the same commit that
      # fixes sites. Follow-up: 2026-11-07-nouncheckedindexedaccess-remaining-buckets.
      - name: Check noUncheckedIndexedAccess ratchet
        run: pnpm typecheck:indexed-access
      # Phase 34.2 gap cycle 4, WR-11. Six planning gates existed for weeks
      # wired into nothing; two were silently red the first time anyone ran
      # them. Discovery is by '*-gate.py' suffix, so a seventh gate is picked
      # up without editing this workflow, and the runner fails if it finds
      # fewer than six (a glob that matches nothing must not report green).
      - name: Check planning-document gates
        run: pnpm planning-gates
