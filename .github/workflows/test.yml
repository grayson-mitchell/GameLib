name: Test
permissions:
  contents: read

on:
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository.
        uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Test CI
        run: pnpm test:ci
      # Phase 35 (D-35-10-01 follow-up, 2026-08-29). This gate existed but ran NOWHERE -- not in
      # CI, not in .husky -- so it caught nothing for as long as it has existed. On the day it was
      # first run it was already RED: plan 35-10's `installed.json` watcher held an un-unref'd
      # FSWatcher, so the sidecar hung forever on stdin EOF instead of exiting 0.
      #
      # It is the ONLY check for that failure class. Its own header records why: the 2026-08-23
      # boot-order regression left all 176 backend jest suites GREEN, `pnpm build:sidecar` exit 0,
      # and `tsc --noEmit` exit 0, because the bundle builds fine -- it just cannot run. Anything
      # evaluation-order or event-loop dependent is invisible to jest BY CONSTRUCTION, since jest
      # supplies its own module registry and never runs the real bundle.
      #
      # Costs about a second. Runs after test:ci so a plain unit-test failure reports first.
      - name: Sidecar startup smoke
        run: pnpm smoke:sidecar
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository.
        uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Fix ownership and mode
        run: sudo chown root /home/runner/work/HeroicGamesLauncher/HeroicGamesLauncher/node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 /home/runner/work/HeroicGamesLauncher/HeroicGamesLauncher/node_modules/electron/dist/chrome-sandbox
      - name: Test E2E
        run: pnpm test:e2e
