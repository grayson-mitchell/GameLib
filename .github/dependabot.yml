version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 0 disables version-update PRs; security updates still open once the repo setting is on.
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # 0 disables version-update PRs; security updates still open once the repo setting is on.
    open-pull-requests-limit: 0
