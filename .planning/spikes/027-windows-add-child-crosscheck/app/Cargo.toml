[package]
name = "spike-027-windows-add-child-crosscheck"
version = "0.0.0"
description = "Spike 027 — cross-target `cargo check` of spike 016's unmodified add_child harness against x86_64-pc-windows-{msvc,gnu}, run from a Linux host with no Windows machine/linker available."
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Features MATCH src-tauri/Cargo.toml PLUS `unstable`, which gates
# Window::add_child / WindowBuilder (tauri-2.11.5/src/window/mod.rs:1126).
# The shared CARGO_TARGET_DIR still reuses every crate BELOW tauri; the
# `tauri` crate itself recompiles once for the changed feature set.
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macOS-only in spike 016 too, at the USE site (`ns_window_number`'s
# `#[cfg(target_os = "macos")]` block) — gated here to match, so a Windows/Linux
# target never has to resolve this crate at all rather than merely not calling it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
