[package]
name = "chunk-decode-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes = "0.8"
cbc = "0.1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
xz2 = { version = "0.1", features = ["static"] }
lzma-rs = "0.3"
sha1 = "0.10"
hex = "0.4"
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
