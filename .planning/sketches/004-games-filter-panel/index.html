<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sketch 004 — Games filter panel</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Cabin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #0b0d0e; font-family: var(--font-sans); color: var(--color-text);
  padding-top: 52px; padding-bottom: 60px;
}

/* ─── sketch chrome ──────────────────────────────────────────── */
#variant-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
  background: #16181a; border-bottom: 1px solid #2a2e31; padding: 8px 16px;
  display: flex; gap: 8px; align-items: center; font-family: system-ui, sans-serif;
}
#variant-nav .brand {
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: #6b7376; margin-right: 12px; font-weight: 600;
}
.variant-tab {
  background: transparent; border: 1px solid #2a2e31; color: #b9c0c2; padding: 6px 12px;
  border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; transition: all .15s ease;
}
.variant-tab:hover { border-color: #4a5154; color: #e6ebec; }
.variant-tab.active { background: #1de8f5; border-color: #1de8f5; color: #08191b; font-weight: 600; }

.variant { display: none; padding: 28px 24px 0; }
.variant.active { display: block; }
.variant-caption { max-width: 1220px; margin: 0 auto 16px; font-family: system-ui, sans-serif; }
.variant-caption h2 { margin: 0 0 6px; font-size: 15px; color: #e6ebec; font-weight: 600; }
.variant-caption p { margin: 0; font-size: 13px; line-height: 1.55; color: #8b9295; max-width: 80ch; }
.tradeoff { display: flex; gap: 18px; font-size: 12px; margin-top: 10px; flex-wrap: wrap; }
.tradeoff span { color: #8b9295; }
.good b { color: #58c06d; } .bad b { color: #d6704e; } .ref b { color: #7aa7d6; }

/* ─── window ─────────────────────────────────────────────────── */
.window {
  max-width: 1220px; margin: 0 auto; border-radius: 10px; overflow: hidden;
  border: 1px solid #2a2e31; box-shadow: var(--shadow-lg); background: var(--color-bg);
}
.titlebar {
  height: var(--titlebar-height); display: flex; align-items: center; padding: 0 var(--space-4);
  gap: 8px; position: relative; background: var(--navbar-background);
}
.tl { width: 12px; height: 12px; border-radius: 50%; }
.tl.r { background: #ff5f57; } .tl.y { background: #febc2e; } .tl.g { background: #28c840; }
.titlebar .win-title {
  position: absolute; left: 0; right: 0; text-align: center; font-size: var(--text-xs);
  color: var(--color-text-dim); letter-spacing: .06em; pointer-events: none;
}
.tl-zone {
  display: none; position: absolute; top: 0; left: 0; width: var(--traffic-light-inset); bottom: 0;
  border-right: 1px dashed #ff5f57; background: rgba(255,95,87,.10); align-items: flex-end;
  justify-content: center; padding-bottom: 2px; font-size: 9px; color: #ff8a84;
  font-family: ui-monospace, monospace;
}
body.annotate .tl-zone { display: flex; }

/* tier 1 — card tabs (001-C) */
.navbar {
  background: var(--navbar-background); display: flex; align-items: flex-end;
  padding-left: var(--traffic-light-inset); padding-right: var(--space-4); gap: var(--space-4);
  position: relative; height: 50px; border-bottom: 1px solid var(--color-border);
}
.wordmark {
  display: flex; align-items: center; gap: 8px; padding-right: var(--space-4);
  font-weight: var(--bold); font-size: var(--text-base); color: var(--color-text);
  white-space: nowrap; align-self: center;
}
.wordmark .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--color-primary); }
.tabs { display: flex; gap: 3px; align-items: flex-end; }
.tab {
  border: 1px solid transparent; border-bottom: none; background: transparent; cursor: pointer;
  font-family: inherit; font-size: var(--text-sm); font-weight: var(--medium);
  color: var(--color-text-dim); padding: 8px 16px 9px; border-radius: var(--radius-md) var(--radius-md) 0 0;
  display: flex; align-items: center; transition: all .15s ease; position: relative; top: 1px; white-space: nowrap;
}
.tab:hover { color: var(--color-text-muted); background: rgba(255,255,255,.04); }
.tab.active {
  background: var(--color-bg); color: var(--color-text); border-color: var(--color-border);
  border-bottom: 1px solid var(--color-bg); font-weight: var(--semibold); padding-bottom: 10px;
}
.nav-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-1); align-self: center; }
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--radius-sm); border: none; background: transparent;
  color: var(--color-text-muted); cursor: pointer; display: grid; place-items: center;
  transition: all .15s ease; font-size: 14px;
}
.icon-btn:hover { background: rgba(255,255,255,.07); color: var(--color-text); }
.dl-btn { display: flex; align-items: center; gap: 6px; width: auto; padding: 0 9px; }
.dl-ring {
  width: 15px; height: 15px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--color-primary) 0turn .59turn, var(--color-border) .59turn 1turn);
  position: relative;
}
.dl-ring::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--navbar-background); }
.dl-btn .n { font-size: var(--text-xs); font-weight: 600; }
.avatar {
  width: 26px; height: 26px; border-radius: 50%; margin-left: 6px; cursor: pointer;
  background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
  display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #08191b;
}

/* ─── tier 2 — the Games filter panel ────────────────────────── */
.page { display: flex; min-height: 560px; background: var(--color-bg); }
.panel {
  width: 218px; flex: none; border-right: 1px solid var(--color-border);
  padding: var(--space-3) var(--space-2) var(--space-4); overflow-y: auto; max-height: 620px;
}
.search-wrap { padding: 0 var(--space-1) var(--space-3); position: relative; }
.search {
  width: 100%; background: var(--color-surface-raised); border: 1px solid var(--color-border);
  color: var(--color-text); padding: 7px 26px 7px 28px; border-radius: var(--radius-sm);
  font-family: inherit; font-size: var(--text-sm);
}
.search::placeholder { color: var(--color-text-dim); }
.search:focus { outline: none; border-color: var(--color-primary); }
.search-wrap .mag {
  position: absolute; left: 12px; top: 50%; transform: translateY(-60%);
  color: var(--color-text-dim); font-size: 13px; pointer-events: none;
}
.search-wrap .clr {
  position: absolute; right: 10px; top: 50%; transform: translateY(-58%); border: none;
  background: transparent; color: var(--color-text-dim); cursor: pointer; font-size: 13px; padding: 0;
  display: none;
}
.search-wrap .clr.show { display: block; }
.search-wrap .clr:hover { color: var(--color-text); }

.grp-label {
  padding: var(--space-3) var(--space-3) var(--space-1); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--color-text-dim); font-weight: 600;
  display: flex; align-items: center; gap: 6px;
}
.grp-label.click { cursor: pointer; user-select: none; border-radius: var(--radius-sm); }
.grp-label.click:hover { color: var(--color-text-muted); background: rgba(255,255,255,.04); }
.grp-label .caret { transition: transform .16s ease; font-size: 9px; opacity: .8; }
.grp-label.collapsed .caret { transform: rotate(-90deg); }
.grp-body { overflow: hidden; transition: max-height .2s ease; max-height: 600px; }
.grp-body.collapsed { max-height: 0; }

.item {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 6px var(--space-3); background: transparent; border: none; cursor: pointer;
  font-family: inherit; font-size: var(--text-sm); color: var(--color-text-muted);
  border-radius: var(--radius-sm); transition: all .12s ease; margin-bottom: 1px;
}
.item:hover { background: rgba(255,255,255,.06); color: var(--color-text); }
.item.active { background: var(--color-surface-raised); color: var(--color-text); font-weight: var(--semibold); }
.item .gl { width: 16px; text-align: center; flex: none; opacity: .85; font-size: 12px; }
.item .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ct { font-size: 10px; color: var(--color-text-dim); font-variant-numeric: tabular-nums; flex: none; }
.item.active .ct { color: var(--color-text-muted); }
.item.zero { opacity: .38; }

.chk {
  width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--color-border-strong);
  flex: none; display: grid; place-items: center; font-size: 10px; color: transparent;
  transition: all .12s ease; line-height: 1;
}
.item.on .chk { background: var(--color-primary); border-color: var(--color-primary); color: #08191b; }
.item.on { color: var(--color-text); }

.sep { height: 1px; background: var(--color-border); margin: var(--space-3) var(--space-3); }
.panel-foot { padding: var(--space-3) var(--space-3) 0; }
.link-btn {
  background: transparent; border: none; color: var(--color-primary); cursor: pointer;
  font-family: inherit; font-size: var(--text-xs); padding: 0; text-decoration: underline;
  text-underline-offset: 2px;
}
.link-btn:hover { color: var(--color-primary-hover); }
.swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ─── content ────────────────────────────────────────────────── */
.content { padding: var(--space-5, 20px) var(--space-6) var(--space-6); flex: 1; min-width: 0; }
.content-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
.content-head h3 { margin: 0; font-size: var(--text-lg); font-weight: var(--semibold); }
.content-head .count { font-size: var(--text-sm); color: var(--color-text-dim); }
.content-head .spacer { flex: 1; }
.sortsel {
  background: var(--color-surface-raised); border: 1px solid var(--color-border); color: var(--color-text);
  padding: 5px 9px; border-radius: var(--radius-sm); font-family: inherit; font-size: var(--text-xs); cursor: pointer;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-4); min-height: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--color-surface-raised);
  border: 1px solid var(--color-border-strong); color: var(--color-text); font-size: var(--text-xs);
  padding: 3px 8px; border-radius: var(--radius-full); cursor: pointer; font-family: inherit;
  transition: all .13s ease;
}
.chip:hover { border-color: var(--color-danger); color: var(--color-danger); }
.chip .x { opacity: .65; font-size: 12px; line-height: 1; }
.chip.clear { border-style: dashed; color: var(--color-text-dim); }
.chip.clear:hover { color: var(--color-primary); border-color: var(--color-primary); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: var(--space-4); }
.card { cursor: pointer; transition: transform .15s ease; }
.card:hover { transform: translateY(-3px); }
.card:hover .art { border-color: var(--color-primary); }
.art {
  aspect-ratio: 3/4; border-radius: var(--radius-md); border: 1px solid var(--color-border);
  display: grid; place-items: center; padding: var(--space-2); text-align: center;
  font-size: var(--text-xs); font-weight: var(--semibold); line-height: 1.3;
  color: rgba(255,255,255,.92); transition: border-color .15s ease; position: relative; overflow: hidden;
}
.store-chip {
  position: absolute; top: 5px; right: 5px; font-size: 8px; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 5px; border-radius: 3px; font-weight: 700; background: rgba(0,0,0,.62); color: rgba(255,255,255,.88);
}
.fav-star { position: absolute; top: 5px; left: 5px; font-size: 11px; color: #ffd15c; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.inst-dot {
  position: absolute; bottom: 6px; left: 6px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--color-success); box-shadow: 0 0 0 2px rgba(0,0,0,.45);
}
.card .name { margin-top: 7px; font-size: var(--text-xs); color: var(--color-text-muted); line-height: 1.35; }
.card .meta { font-size: 10px; color: var(--color-text-dim); margin-top: 2px; }

.empty {
  border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md);
  padding: var(--space-12) var(--space-8); text-align: center; color: var(--color-text-dim);
  font-size: var(--text-sm);
}
.empty b { display: block; color: var(--color-text); font-size: var(--text-base); margin-bottom: 6px; font-weight: 600; }

/* ─── toolbar ────────────────────────────────────────────────── */
#sketch-tools {
  position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui, sans-serif;
  font-size: 12px; background: rgba(0,0,0,.82); color: #fff; padding: 8px 12px; border-radius: 8px;
  opacity: .4; transition: opacity .2s; display: flex; gap: 8px; align-items: center;
  border: 1px solid rgba(255,255,255,.12);
}
#sketch-tools:hover { opacity: 1; }
#sketch-tools select, #sketch-tools button {
  background: #24282a; color: #fff; border: 1px solid #3a4042; border-radius: 5px;
  padding: 4px 8px; font-size: 11px; font-family: inherit; cursor: pointer;
}
#sketch-tools button:hover { background: #333a3c; }
#sketch-tools button.on { background: #1de8f5; color: #08191b; border-color: #1de8f5; font-weight: 600; }
#sketch-tools .sep2 { width: 1px; height: 18px; background: rgba(255,255,255,.15); }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="brand">Sketch 004 · Games filter panel</span>
  <button class="variant-tab active" onclick="showVariant('a', this)">A: Steam-style views</button>
  <button class="variant-tab" onclick="showVariant('b', this)">B: Playnite-style facets</button>
  <button class="variant-tab" onclick="showVariant('c', this)">C: Hybrid</button>
</div>

<div id="variant-a" class="variant active"></div>
<div id="variant-b" class="variant"></div>
<div id="variant-c" class="variant"></div>

<div id="sketch-tools">
  <select id="theme-switcher" onchange="setTheme(this.value)" title="Theme">
    <option value="default">midnightMirage</option>
    <option value="gruvbox">gruvbox_dark</option>
    <option value="dracula">dracula</option>
  </select>
  <div class="sep2"></div>
  <button onclick="setWidth(820,this)">820</button>
  <button onclick="setWidth(1024,this)">1024</button>
  <button class="on" onclick="setWidth(1220,this)">Full</button>
  <div class="sep2"></div>
  <button id="annBtn" onclick="toggleAnnotate(this)">Annotate</button>
</div>

<script>
/* ═══ library data ═══════════════════════════════════════════════
   name, store, installed, platforms, genres, favourite, daysAgo, collection */
const STORES = {
  Steam:  '#1b2838',
  GOG:    '#7d1f9c',
  Epic:   '#2f2f2f',
  Amazon: '#ff9900'
};

const LIB = [
  ['Hades II','Steam',1,['mac','win'],['Action','Roguelike'],1,2,'Roguelikes','linear-gradient(150deg,#7b2d5e,#2b1030)'],
  ["Baldur's Gate 3",'GOG',1,['mac','win'],['RPG'],1,5,'Backlog','linear-gradient(150deg,#8a3b1e,#2d1408)'],
  ['Elden Ring','Steam',0,['win'],['RPG','Action'],1,null,'Backlog','linear-gradient(150deg,#6b5a1f,#241d08)'],
  ['Hollow Knight: Silksong','Epic',1,['mac','win','linux'],['Action','Indie'],0,1,'','linear-gradient(150deg,#1f4a6b,#08161f)'],
  ['Disco Elysium','GOG',1,['mac','win','linux'],['RPG','Indie'],1,12,'','linear-gradient(150deg,#6b1f2e,#210a10)'],
  ['Outer Wilds','Epic',0,['win'],['Adventure','Indie'],0,null,'Backlog','linear-gradient(150deg,#2d4a6b,#0b1420)'],
  ['Stardew Valley','Steam',1,['mac','win','linux'],['Simulation','Indie'],1,3,'Cozy','linear-gradient(150deg,#3d6b2d,#0f2008)'],
  ['Factorio','Steam',1,['mac','win','linux'],['Strategy','Simulation'],0,20,'','linear-gradient(150deg,#6b4a1f,#211607)'],
  ['Celeste','Amazon',0,['mac','win','linux'],['Platformer','Indie'],1,null,'Cozy','linear-gradient(150deg,#4a2d6b,#150a20)'],
  ['Slay the Spire','GOG',1,['mac','win','linux'],['Roguelike','Strategy'],0,8,'Roguelikes','linear-gradient(150deg,#6b2d2d,#200a0a)'],
  ['Cyberpunk 2077','GOG',0,['win'],['RPG','Action'],0,null,'Backlog','linear-gradient(150deg,#6b6420,#201e07)'],
  ['Return of the Obra Dinn','Steam',1,['mac','win'],['Adventure','Indie'],1,30,'','linear-gradient(150deg,#4a4a4a,#141414)'],
  ['Dead Cells','Steam',0,['mac','win','linux'],['Roguelike','Action'],0,null,'Roguelikes','linear-gradient(150deg,#2d5a6b,#0a1a20)'],
  ['Hades','Epic',1,['mac','win'],['Roguelike','Action'],0,45,'Roguelikes','linear-gradient(150deg,#8a2d3e,#2a0a12)'],
  ['Portal 2','Steam',0,['mac','win','linux'],['Puzzle'],1,null,'Co-op','linear-gradient(150deg,#3a5a7a,#0d1720)'],
  ['Terraria','Steam',1,['mac','win','linux'],['Adventure','Simulation'],0,60,'Co-op','linear-gradient(150deg,#3d6b5a,#0f201a)'],
  ['Divinity: Original Sin 2','GOG',0,['mac','win'],['RPG','Strategy'],0,null,'Co-op','linear-gradient(150deg,#6b3d1f,#201207)'],
  ['Into the Breach','Epic',0,['mac','win','linux'],['Strategy','Indie'],0,null,'','linear-gradient(150deg,#2d3d6b,#0a0f20)'],
  ['Spiritfarer','Amazon',0,['mac','win','linux'],['Adventure','Indie'],0,null,'Cozy','linear-gradient(150deg,#2d6b6b,#0a2020)'],
  ['Unpacking','Amazon',1,['mac','win','linux'],['Puzzle','Indie'],0,15,'Cozy','linear-gradient(150deg,#6b5a4a,#201a14)'],
  ['Tunic','Epic',0,['mac','win'],['Adventure','Indie'],1,null,'','linear-gradient(150deg,#4a6b2d,#14200a)'],
  ['Vampire Survivors','Steam',1,['mac','win','linux'],['Roguelike','Action'],0,4,'Roguelikes','linear-gradient(150deg,#5a2d6b,#1a0a20)'],
  ['Baba Is You','GOG',0,['mac','win','linux'],['Puzzle','Indie'],0,null,'','linear-gradient(150deg,#4a4a6b,#141420)'],
  ['Frostpunk','Epic',0,['win'],['Strategy','Simulation'],0,null,'Backlog','linear-gradient(150deg,#3d5a6b,#0f1a20)']
];

const F = { name:0, store:1, inst:2, plat:3, genre:4, fav:5, days:6, coll:7, art:8 };
const PLAT_LABEL = { mac: 'macOS', win: 'Windows', linux: 'Linux' };
const PLAT_GLYPH = { mac: '', win: '⊞', linux: '🐧' };
const ALL_GENRES = [...new Set(LIB.flatMap(g => g[F.genre]))].sort();
const ALL_COLLS = [...new Set(LIB.map(g => g[F.coll]).filter(Boolean))].sort();

/* ═══ filter engine (shared by all variants) ═════════════════════ */
function blankState() {
  return { q: '', view: 'all', coll: '', stores: new Set(), plats: new Set(), genres: new Set(), sort: 'name' };
}
const S = { a: blankState(), b: blankState(), c: blankState() };
const COLLAPSED = { a: {}, b: {}, c: {} };

function passesView(g, view) {
  if (view === 'installed') return g[F.inst] === 1;
  if (view === 'recent') return g[F.days] !== null && g[F.days] <= 14;
  if (view === 'fav') return g[F.fav] === 1;
  return true;
}

function filtered(st, opts = {}) {
  const skip = opts.skip || '';
  return LIB.filter(g => {
    if (st.q && !g[F.name].toLowerCase().includes(st.q.toLowerCase())) return false;
    if (skip !== 'view' && !passesView(g, st.view)) return false;
    if (skip !== 'coll' && st.coll && g[F.coll] !== st.coll) return false;
    if (skip !== 'store' && st.stores.size && !st.stores.has(g[F.store])) return false;
    if (skip !== 'plat' && st.plats.size && !g[F.plat].some(p => st.plats.has(p))) return false;
    if (skip !== 'genre' && st.genres.size && !g[F.genre].some(x => st.genres.has(x))) return false;
    return true;
  });
}

/* counts computed against everything EXCEPT the facet being counted,
   so a facet never shows 0 for an option that would widen the result */
function countFor(st, kind, value) {
  return filtered(st, { skip: kind }).filter(g => {
    if (kind === 'store') return g[F.store] === value;
    if (kind === 'plat')  return g[F.plat].includes(value);
    if (kind === 'genre') return g[F.genre].includes(value);
    if (kind === 'coll')  return g[F.coll] === value;
    if (kind === 'view')  return passesView(g, value);
    return true;
  }).length;
}

function sortGames(list, sort) {
  const c = [...list];
  if (sort === 'name') c.sort((a, b) => a[F.name].localeCompare(b[F.name]));
  if (sort === 'recent') c.sort((a, b) => (a[F.days] ?? 9e9) - (b[F.days] ?? 9e9));
  if (sort === 'store') c.sort((a, b) => a[F.store].localeCompare(b[F.store]) || a[F.name].localeCompare(b[F.name]));
  return c;
}

/* ═══ panel builders ═════════════════════════════════════════════ */
const VIEWS = [
  ['all', '▦', 'All games'],
  ['installed', '⤓', 'Installed'],
  ['recent', '↻', 'Recently played'],
  ['fav', '★', 'Favourites']
];

function searchBox(v) {
  const st = S[v];
  return `<div class="search-wrap">
    <span class="mag">⌕</span>
    <input class="search" id="q-${v}" placeholder="Search library…" value="${st.q.replace(/"/g,'&quot;')}"
           oninput="setQ('${v}', this.value)">
    <button class="clr ${st.q ? 'show' : ''}" onclick="setQ('${v}','')" title="Clear">✕</button>
  </div>`;
}

function viewList(v) {
  const st = S[v];
  return VIEWS.map(([k, g, t]) => {
    const n = countFor(st, 'view', k);
    return `<button class="item ${st.view === k ? 'active' : ''} ${n === 0 ? 'zero' : ''}" onclick="setView('${v}','${k}')">
      <span class="gl">${g}</span><span class="lbl">${t}</span><span class="ct">${n}</span>
    </button>`;
  }).join('');
}

function collList(v) {
  const st = S[v];
  return ALL_COLLS.map(c => {
    const n = countFor(st, 'coll', c);
    return `<button class="item ${st.coll === c ? 'active' : ''} ${n === 0 ? 'zero' : ''}" onclick="setColl('${v}','${c}')">
      <span class="gl">▤</span><span class="lbl">${c}</span><span class="ct">${n}</span>
    </button>`;
  }).join('');
}

function facet(v, kind, title, options, glyphFn) {
  const st = S[v];
  const set = kind === 'store' ? st.stores : kind === 'plat' ? st.plats : st.genres;
  const collapsed = COLLAPSED[v][kind] ? ' collapsed' : '';
  const rows = options.map(o => {
    const n = countFor(st, kind, o);
    const on = set.has(o);
    return `<button class="item ${on ? 'on' : ''} ${n === 0 && !on ? 'zero' : ''}" onclick="toggleFacet('${v}','${kind}','${o}')">
      <span class="chk">✓</span>${glyphFn ? glyphFn(o) : ''}
      <span class="lbl">${kind === 'plat' ? PLAT_LABEL[o] : o}</span><span class="ct">${n}</span>
    </button>`;
  }).join('');
  return `<div class="grp-label click${collapsed}" onclick="toggleGrp('${v}','${kind}')">
      <span class="caret">▾</span>${title}${set.size ? ` · ${set.size}` : ''}
    </div>
    <div class="grp-body${collapsed}">${rows}</div>`;
}

const storeSwatch = o => `<span class="swatch" style="background:${STORES[o]}"></span>`;

/* ═══ variants ═══════════════════════════════════════════════════ */
const VARIANTS = {
  a: {
    title: 'A — Steam-style: views and collections only',
    blurb: 'Search on top, a flat list of views, then user collections. No faceting at all — you ' +
           'pick one thing at a time. This is close to how Steam\'s library sidebar actually ' +
           'behaves, and it stays legible at a glance. The catch is that GameLib\'s reason to ' +
           'exist is spanning four stores, and this panel gives you no way to ask "show me only ' +
           'my GOG games."',
    good: 'Calmest · one concept to learn · fits 218px comfortably',
    bad: 'No cross-store filtering — the one thing GameLib is for',
    ref: 'Steam library sidebar',
    panel: v => searchBox(v) +
      `<div class="grp-label">Views</div>${viewList(v)}` +
      `<div class="sep"></div><div class="grp-label">Collections</div>${collList(v)}` +
      `<div class="panel-foot"><button class="link-btn" onclick="toast('New collection…')">＋ New collection</button></div>`
  },
  b: {
    title: 'B — Playnite-style: everything is a facet',
    blurb: 'Search plus collapsible multi-select facet groups — Store, Platform, Genre — each with ' +
           'live counts. Counts are computed excluding their own facet, so a number never reads ' +
           'zero for an option that would widen your result. Extremely capable: "installed macOS ' +
           'roguelikes on GOG" is four clicks. The cost is density, and that a first-time user ' +
           'meets a wall of controls before a single game.',
    good: 'Genuinely powerful · counts guide the next click · scales as the library grows',
    bad: 'Dense · slowest to parse cold · needs scrolling at 218px',
    ref: 'Playnite filter panel',
    panel: v => searchBox(v) +
      `<div class="grp-label">Views</div>${viewList(v)}` +
      `<div class="sep"></div>` +
      facet(v, 'store', 'Store', Object.keys(STORES), storeSwatch) +
      facet(v, 'plat', 'Platform', ['mac', 'win', 'linux']) +
      facet(v, 'genre', 'Genre', ALL_GENRES)
  },
  c: {
    title: 'C — Hybrid: views up top, facets below the fold',
    blurb: 'The common case stays one click — views and collections sit at the top, exactly as in ' +
           'A. The faceted power from B lives underneath, collapsed by default, so it is present ' +
           'without being the first thing you meet. Active filters surface as removable chips ' +
           'above the grid, which is the part neither A nor B does: you can always see why you ' +
           'are looking at 6 games instead of 24.',
    good: 'Easy path stays easy · power is there when wanted · chips make state visible',
    bad: 'Most moving parts to build · two mental models in one panel',
    ref: 'Steam + Playnite, GOG Galaxy chips',
    panel: v => searchBox(v) +
      `<div class="grp-label">Views</div>${viewList(v)}` +
      `<div class="sep"></div><div class="grp-label">Collections</div>${collList(v)}` +
      `<div class="sep"></div>` +
      facet(v, 'store', 'Store', Object.keys(STORES), storeSwatch) +
      facet(v, 'plat', 'Platform', ['mac', 'win', 'linux']) +
      facet(v, 'genre', 'Genre', ALL_GENRES)
  }
};

/* ═══ chips (variant C only) ═════════════════════════════════════ */
function chips(v) {
  const st = S[v];
  const out = [];
  if (st.view !== 'all') {
    const lbl = VIEWS.find(x => x[0] === st.view)[2];
    out.push(`<button class="chip" onclick="setView('${v}','all')">${lbl}<span class="x">✕</span></button>`);
  }
  if (st.coll) out.push(`<button class="chip" onclick="setColl('${v}','${st.coll}')">${st.coll}<span class="x">✕</span></button>`);
  st.stores.forEach(s => out.push(`<button class="chip" onclick="toggleFacet('${v}','store','${s}')">${s}<span class="x">✕</span></button>`));
  st.plats.forEach(p => out.push(`<button class="chip" onclick="toggleFacet('${v}','plat','${p}')">${PLAT_LABEL[p]}<span class="x">✕</span></button>`));
  st.genres.forEach(g => out.push(`<button class="chip" onclick="toggleFacet('${v}','genre','${g}')">${g}<span class="x">✕</span></button>`));
  if (st.q) out.push(`<button class="chip" onclick="setQ('${v}','')">“${st.q}”<span class="x">✕</span></button>`);
  if (out.length > 1) out.push(`<button class="chip clear" onclick="clearAll('${v}')">Clear all</button>`);
  return out.length ? `<div class="chips">${out.join('')}</div>` : '';
}

/* ═══ render ═════════════════════════════════════════════════════ */
function cardHTML(g) {
  return `<div class="card">
    <div class="art" style="background:${g[F.art]}">
      ${g[F.fav] ? '<span class="fav-star">★</span>' : ''}
      <span class="store-chip">${g[F.store]}</span>
      ${g[F.inst] ? '<span class="inst-dot" title="Installed"></span>' : ''}
      ${g[F.name]}
    </div>
    <div class="name">${g[F.name]}</div>
    <div class="meta">${g[F.inst] ? 'Installed' : 'In library'} · ${g[F.plat].map(p => PLAT_GLYPH[p]).join(' ')}</div>
  </div>`;
}

function render(v) {
  const cfg = VARIANTS[v];
  const st = S[v];
  const res = sortGames(filtered(st), st.sort);
  const showChips = v === 'c';

  document.getElementById('variant-' + v).innerHTML = `
    <div class="variant-caption">
      <h2>${cfg.title}</h2>
      <p>${cfg.blurb}</p>
      <div class="tradeoff">
        <span class="good"><b>+</b> ${cfg.good}</span>
        <span class="bad"><b>−</b> ${cfg.bad}</span>
        <span class="ref"><b>≈</b> ${cfg.ref}</span>
      </div>
    </div>
    <div class="window">
      <div class="titlebar">
        <div class="tl-zone">78px</div>
        <span class="tl r"></span><span class="tl y"></span><span class="tl g"></span>
        <span class="win-title">GameLib</span>
      </div>
      <div class="navbar">
        <div class="wordmark"><span class="dot"></span>GameLib</div>
        <div class="tabs">
          <button class="tab" onclick="toast('Manage Accounts — no tier-2 panel, runs full-bleed')">Manage Accounts</button>
          <button class="tab active">Games</button>
          <button class="tab" onclick="toast('Stores — tier 2 is a nav list')">Stores</button>
          <button class="tab" onclick="toast('Settings — tier 2 is a nav list')">Settings</button>
        </div>
        <div class="nav-right">
          <button class="icon-btn dl-btn" title="Downloads — 1 active, 1 queued"><span class="dl-ring"></span><span class="n">2</span></button>
          <div class="avatar">G</div>
        </div>
      </div>
      <div class="page">
        <div class="panel">${cfg.panel(v)}</div>
        <div class="content">
          <div class="content-head">
            <h3>Games</h3>
            <span class="count">${res.length} of ${LIB.length}</span>
            <span class="spacer"></span>
            <select class="sortsel" onchange="setSort('${v}', this.value)">
              <option value="name"${st.sort==='name'?' selected':''}>Name A–Z</option>
              <option value="recent"${st.sort==='recent'?' selected':''}>Recently played</option>
              <option value="store"${st.sort==='store'?' selected':''}>Store</option>
            </select>
          </div>
          ${showChips ? chips(v) : ''}
          ${res.length
            ? `<div class="grid">${res.map(cardHTML).join('')}</div>`
            : `<div class="empty"><b>No games match</b>Loosen a filter or clear the search.
                 <div style="margin-top:14px"><button class="chip clear" onclick="clearAll('${v}')">Clear all filters</button></div></div>`}
        </div>
      </div>
    </div>`;

  const inp = document.getElementById('q-' + v);
  if (inp && document.activeElement !== inp && st._focus) { inp.focus(); inp.setSelectionRange(st.q.length, st.q.length); }
}

/* ═══ actions ════════════════════════════════════════════════════ */
function setQ(v, val) { S[v].q = val; S[v]._focus = true; render(v); }
function setView(v, k) { S[v].view = k; S[v]._focus = false; render(v); }
function setColl(v, c) { S[v].coll = S[v].coll === c ? '' : c; S[v]._focus = false; render(v); }
function setSort(v, s) { S[v].sort = s; S[v]._focus = false; render(v); }
function toggleGrp(v, k) { COLLAPSED[v][k] = !COLLAPSED[v][k]; S[v]._focus = false; render(v); }
function toggleFacet(v, kind, val) {
  const st = S[v];
  const set = kind === 'store' ? st.stores : kind === 'plat' ? st.plats : st.genres;
  set.has(val) ? set.delete(val) : set.add(val);
  st._focus = false;
  render(v);
}
function clearAll(v) { const s = S[v].sort; S[v] = blankState(); S[v].sort = s; render(v); }

function showVariant(id, el) {
  document.querySelectorAll('.variant').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-' + id).classList.add('active');
  el.classList.add('active');
}
function setTheme(name) { document.querySelector('link[href*="themes/"]').href = '../themes/' + name + '.css'; }
function setWidth(px, el) {
  document.querySelectorAll('#sketch-tools button').forEach(b => { if (b.id !== 'annBtn') b.classList.remove('on'); });
  el.classList.add('on');
  document.querySelectorAll('.window').forEach(w => w.style.maxWidth = px + 'px');
}
function toggleAnnotate(el) { document.body.classList.toggle('annotate'); el.classList.toggle('on'); }
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:64px;right:12px;z-index:9999;background:#1de8f5;color:#08191b;' +
      'padding:9px 15px;border-radius:7px;font-family:system-ui,sans-serif;font-size:12px;font-weight:600;' +
      'box-shadow:0 6px 18px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;max-width:330px;line-height:1.4;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translateY(0)';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(6px)'; }, 2400);
}

/* collapse the heavy facets by default in B and C */
COLLAPSED.c.plat = true; COLLAPSED.c.genre = true; COLLAPSED.c.store = true;
COLLAPSED.b.genre = true;
['a','b','c'].forEach(render);
</script>
</body>
</html>
