<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch 005 — Views section distinction</title>
    <link rel="stylesheet" href="../themes/default.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Cabin:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ───────────────────────────────────────────────────────────────
         Sketch 005 — does the Views section read as a different KIND of
         control from the facet groups below it?

         Every row style below is derived from the SHIPPED stylesheets, not
         invented:
           NavItem/index.scss          — Views + Collections row base
           FilterFacetGroup/index.scss — group header, facet row, checkbox
         The three themes carry the real --navbar-* values, so what you see
         here is what the app renders.
         ─────────────────────────────────────────────────────────────── */

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 64px 0 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        -webkit-font-smoothing: antialiased;
      }

      /* ── variant tab bar ───────────────────────────────────────────── */
      #variant-nav {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 9998;
        display: flex;
        gap: var(--space-2);
        align-items: center;
        padding: var(--space-2) var(--space-4);
        background: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
      }

      .variant-tab {
        appearance: none;
        background: none;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        color: var(--color-text-muted);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        padding: 6px 12px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .variant-tab:hover {
        color: var(--color-text);
        background: var(--color-surface-raised);
      }
      .variant-tab.active {
        color: var(--color-primary);
        border-color: var(--color-primary);
      }

      #variant-nav .spacer {
        flex: 1;
      }
      #variant-nav .hint {
        font-size: var(--text-xs);
        color: var(--color-text-dim);
        font-family: var(--font-secondary);
      }

      /* ── page scaffold ─────────────────────────────────────────────── */
      .variant {
        padding: var(--space-6) var(--space-8) var(--space-12);
      }
      .variant[hidden] {
        display: none;
      }

      .vhead {
        max-width: 980px;
        margin: 0 0 var(--space-6);
      }
      .vhead h1 {
        font-size: var(--text-xl);
        font-weight: var(--medium);
        margin: 0 0 6px;
      }
      .vhead p {
        margin: 0;
        font-size: var(--text-sm);
        color: var(--color-text-muted);
        line-height: 1.55;
        max-width: 72ch;
      }
      .vhead code {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 0.9em;
        color: var(--color-text);
      }

      /* The simulated app surface: tier-2 panel beside a games grid. */
      .shell {
        display: flex;
        gap: 0;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--color-bg);
        max-width: 980px;
        box-shadow: var(--shadow-lg);
      }

      /* ── tier-2 panel — the real 204px column ──────────────────────── */
      .panel {
        width: 204px;
        flex: none;
        background: var(--navbar-background);
        border-right: 1px solid var(--color-border);
        padding: var(--space-3) 0 var(--space-4);
        max-height: 560px;
        overflow-y: auto;
        /* --tier2-row-padding-inline, NavItem/index.scss:25 */
        --row-pad: var(--space-2);
        --filter-active-color: var(
          --navbar-active,
          var(--accent-overlay, var(--accent))
        );
      }

      .search {
        margin: 0 var(--row-pad) var(--space-4);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 8px;
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-md);
        color: var(--color-text-dim);
        font-size: var(--text-sm);
      }
      .search input {
        appearance: none;
        background: none;
        border: 0;
        outline: 0;
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        width: 100%;
        min-width: 0;
      }
      .search input::placeholder {
        color: var(--color-text-dim);
      }

      /* Section micro-label — FilterFacetGroup/index.scss:79-100 verbatim
         typography. Shared by the group disclosures AND (in variants A/B)
         by the Views header, which is what makes them read as peers. */
      .grp-label,
      .sec-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        appearance: none;
        background: none;
        border: 0;
        border-radius: var(--space-1);
        color: var(--navbar-accent);
        cursor: pointer;
        user-select: none;
        font-family: var(--font-sans);
        font-size: var(--text-xs);
        font-weight: var(--bold);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        line-height: 1;
        padding: var(--space-1) var(--row-pad);
        transition:
          background-color 0.12s ease,
          color 0.12s ease;
      }
      .grp-label:hover {
        background: var(--navbar-active-background);
        color: var(--filter-active-color);
      }
      /* The Views label is NOT a button — Views has no off state, so a
         collapsible Views group would hide the one filter that is always
         active. No caret, no hover, default cursor. */
      .sec-label {
        cursor: default;
      }

      .grp-label .caret {
        flex: 0 0 auto;
        transition: transform 0.12s ease;
        font-size: 9px;
      }
      .grp-label.collapsed .caret {
        transform: rotate(-90deg);
      }
      .grp-label .title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: start;
      }
      .grp-label .badge {
        flex: 0 0 auto;
        margin-inline-end: var(--space-2);
        font-size: var(--text-xs);
        font-weight: var(--bold);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        color: var(--filter-active-color);
      }

      .grp {
        margin-block-end: var(--space-2);
      }
      .grp-body {
        overflow: hidden;
        max-height: 600px;
        transition: max-height 0.2s ease;
      }
      .grp-body.collapsed {
        max-height: 0;
      }

      /* ── NavItem row — NavItem/index.scss:27-111 ───────────────────── */
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: var(--space-1) var(--row-pad);
        border: none;
        background: none;
        cursor: pointer;
        font-family: var(--font-sans);
        font-size: var(--text-base);
        color: var(--navbar-accent);
        text-align: start;
        transition: color 250ms;
      }
      .row:hover {
        background-color: var(--navbar-active-background);
        transition: 0.1s;
        padding-inline-start: 12px;
      }
      .row.active {
        color: var(--filter-active-color);
        background-color: var(--navbar-active-background);
      }

      /* ── facet row — FilterFacetGroup/index.scss:226-333 ───────────── */
      .facet {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        width: 100%;
        min-width: 0;
        padding: var(--space-1) var(--row-pad);
        border: 0;
        background: none;
        text-align: start;
        cursor: pointer;
        font-family: var(--font-sans);
        font-size: var(--text-base);
        font-weight: var(--regular);
        line-height: 1;
        color: var(--navbar-accent);
        transition:
          background-color 0.12s ease,
          color 0.12s ease;
      }
      .facet:hover {
        background: var(--navbar-active-background);
        color: var(--filter-active-color);
      }
      .facet.checked {
        color: var(--filter-active-color);
        font-weight: var(--bold);
        background: var(--navbar-active-background);
      }
      .facet .box {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        border: 1px solid var(--neutral-05);
        border-radius: var(--space-1);
        background: transparent;
        display: grid;
        place-items: center;
        font-size: 9px;
        color: transparent;
        transition: all 0.12s ease;
      }
      .facet.checked .box {
        background: var(--filter-active-color);
        border-color: var(--filter-active-color);
        color: var(--color-bg);
      }
      .facet .lbl {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .facet .ct {
        flex: 0 0 auto;
        font-size: var(--text-xs);
        font-weight: var(--regular);
        font-variant-numeric: tabular-nums;
        color: var(--color-text-muted);
      }

      /* ═══ VARIANT B — leading accent rail ═══════════════════════════ */
      .v-rail .views .row {
        position: relative;
      }
      .v-rail .views .row.active {
        /* The bar is deliberately GONE. Colour + weight + rail carry it. */
        background-color: transparent;
        font-weight: var(--bold);
      }
      .v-rail .views .row.active::before {
        content: '';
        position: absolute;
        inset-block: 2px;
        inset-inline-start: 0;
        width: 3px;
        border-radius: 0 var(--space-1) var(--space-1) 0;
        background: var(--filter-active-color);
      }

      /* ═══ VARIANT C — segmented control ════════════════════════════ */
      /* Also serves variant D (synthesis): D is C's block with A's header,
         so it reuses this whole block and adds only the header spacing rule
         at the end. Keeping one declaration site is what stops C and D
         drifting on a detail nobody is testing. */
      .v-seg .views {
        margin: 0 var(--row-pad) var(--space-4);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-md);
        overflow: hidden;
        /* Chroma independent of --navbar-active: this chain skips it, so
           gruvbox gets gold (#d79921) instead of cream white. That is the
           whole point of this variant — and also its cost, see README. */
        --seg-active: var(--accent-overlay, var(--accent));
      }
      .v-seg .views .row {
        padding: 7px var(--space-3);
        font-size: var(--text-sm);
        border-radius: 0;
      }
      .v-seg .views .row + .row {
        border-top: 1px solid var(--color-border);
      }
      .v-seg .views .row:hover {
        padding-inline-start: var(--space-3);
        background: var(--navbar-active-background);
      }
      .v-seg .views .row.active {
        background: var(--seg-active);
        color: var(--color-bg);
        font-weight: var(--semibold);
      }

      /* ═══ VARIANT D — C's block + A's header ═══════════════════════ */
      /* The only addition over C: the micro-label needs its own bottom gap,
         because C's block previously sat directly under the search box and
         carried the whole vertical rhythm itself. */
      .v-seg .sec-label {
        margin-block-end: 6px;
      }

      /* ── games grid, so the panel is judged in context ─────────────── */
      .main {
        flex: 1 1 auto;
        min-width: 0; /* library-filtering.md "What to Avoid" */
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .chiprow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        min-height: 22px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--color-surface-raised);
        border: 1px solid var(--color-border-strong);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: var(--text-xs);
        padding: 3px 8px;
        border-radius: var(--radius-full);
        cursor: pointer;
        transition: all 0.13s ease;
      }
      .chip:hover {
        border-color: var(--color-danger);
        color: var(--color-danger);
      }
      .chip.clear {
        border-style: dashed;
        color: var(--color-text-dim);
      }
      .chip.clear:hover {
        color: var(--color-primary);
        border-color: var(--color-primary);
      }
      .countline {
        font-size: var(--text-xs);
        color: var(--color-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: var(--space-3);
      }
      .card {
        border-radius: var(--radius-md);
        overflow: hidden;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
      }
      .card .art {
        aspect-ratio: 3 / 4;
        display: grid;
        place-items: center;
        font-family: var(--font-secondary);
        font-size: var(--text-xs);
        color: var(--color-text-dim);
        background: linear-gradient(
          150deg,
          var(--color-surface-raised),
          var(--color-surface)
        );
      }
      .card .nm {
        padding: 6px 7px 7px;
        font-size: var(--text-xs);
        line-height: 1.3;
        color: var(--color-text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .zero {
        padding: var(--space-8) var(--space-4);
        text-align: center;
        color: var(--color-text-muted);
        font-size: var(--text-sm);
      }

      /* ── measurement strip ─────────────────────────────────────────── */
      .measure {
        max-width: 980px;
        margin-top: var(--space-6);
        border: 1px dashed var(--color-border-strong);
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
        font-family: var(--font-secondary);
        font-size: var(--text-xs);
        color: var(--color-text-muted);
        line-height: 1.6;
      }
      .measure b {
        color: var(--color-text);
        font-weight: var(--semibold);
      }
      .swatches {
        display: flex;
        gap: var(--space-4);
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .sw {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .sw i {
        width: 26px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid var(--color-border-strong);
        display: block;
      }
      .sw code {
        font-family: ui-monospace, monospace;
        font-size: 10px;
      }

      /* ── toolbar ───────────────────────────────────────────────────── */
      #sketch-tools {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 9999;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        padding: 8px 12px;
        border-radius: 8px;
        opacity: 0.45;
        transition: opacity 0.2s;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #sketch-tools select,
      #sketch-tools button {
        font: inherit;
        background: #222;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 2px 6px;
        cursor: pointer;
      }
      body.annotate .panel {
        outline: 1px dashed var(--color-warning);
      }
      body.annotate .views {
        outline: 1px dashed var(--color-success);
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <div id="variant-nav">
      <button class="variant-tab active" data-v="base">
        A: Labelled baseline
      </button>
      <button class="variant-tab" data-v="rail">B: Accent rail</button>
      <button class="variant-tab" data-v="seg">C: Segmented control</button>
      <button class="variant-tab" data-v="synth">
        D: Synthesis — C's block + A's header ★ Selected
      </button>
      <span class="spacer"></span>
      <span class="hint"
        >Switch themes bottom-right — gruvbox is the one that decides it</span
      >
    </div>

    <!-- Variants are generated from one template so the only differences
         between them are the ones under test. Hand-copying three panels
         would let an unrelated detail drift and get read as a finding. -->
    <section class="variant" id="variant-base"></section>
    <section class="variant" id="variant-rail" hidden></section>
    <section class="variant" id="variant-seg" hidden></section>
    <section class="variant" id="variant-synth" hidden></section>

    <div id="sketch-tools">
      <label
        >Theme
        <select id="theme">
          <option value="default">midnightMirage</option>
          <option value="gruvbox">gruvbox_dark</option>
          <option value="dracula">dracula</option>
        </select>
      </label>
      <button id="annotate">Annotate</button>
    </div>

    <script>
      /* ── fake library ───────────────────────────────────────────────── */
      const LIB = [
        ['Hades', 'steam', 1, 1, 0],
        ['Disco Elysium', 'gog', 1, 0, 1],
        ['Hollow Knight', 'steam', 1, 1, 1],
        ['Outer Wilds', 'epic', 0, 0, 1],
        ['Celeste', 'steam', 1, 0, 0],
        ['Return of the Obra Dinn', 'gog', 0, 0, 1],
        ['Slay the Spire', 'steam', 1, 1, 0],
        ['Stardew Valley', 'gog', 1, 1, 1],
        ['Baba Is You', 'steam', 0, 0, 0],
        ['Subnautica', 'epic', 1, 0, 0],
        ['Dead Cells', 'steam', 1, 1, 0],
        ['Tunic', 'amazon', 0, 0, 1],
        ['Inscryption', 'steam', 1, 0, 1],
        ['Pentiment', 'epic', 0, 0, 0],
        ['Cult of the Lamb', 'amazon', 1, 1, 0],
        ['Citizen Sleeper', 'gog', 1, 0, 1]
      ].map(([name, store, installed, recent, fav]) => ({
        name,
        store,
        installed: !!installed,
        recent: !!recent,
        fav: !!fav
      }));

      const VIEWS = [
        ['all', 'All games'],
        ['installed', 'Installed'],
        ['recentlyPlayed', 'Recently played'],
        ['favourites', 'Favourites']
      ];
      const STORES = [
        ['steam', 'Steam'],
        ['gog', 'GOG'],
        ['epic', 'Epic'],
        ['amazon', 'Amazon']
      ];

      /* Independent state per variant — switching tabs must not reset what
         you were looking at, and the three panels must be comparable while
         each sits on a DIFFERENT selected view. */
      const state = {};
      ['base', 'rail', 'seg', 'synth'].forEach((v) => {
        state[v] = {
          view: 'all',
          coll: null,
          stores: new Set(),
          collapsed: { coll: true, store: false, run: true, more: true }
        };
      });

      const passesView = (g, view) =>
        view === 'all'
          ? true
          : view === 'installed'
            ? g.installed
            : view === 'recentlyPlayed'
              ? g.recent
              : g.fav;

      /* `skip` omits one facet so counts never self-reference —
         library-filtering.md decision 2. */
      function filtered(st, skip) {
        return LIB.filter((g) => {
          if (skip !== 'view' && !passesView(g, st.view)) return false;
          if (skip !== 'store' && st.stores.size && !st.stores.has(g.store))
            return false;
          return true;
        });
      }
      const countFor = (st, store) =>
        filtered(st, 'store').filter((g) => g.store === store).length;

      const BLURB = {
        base: [
          'A: Labelled baseline — <code>VIEWS</code> micro-label, tinted bar kept',
          'The control. Views gains the same uppercase header the groups below already have, and nothing else changes. If a header alone is enough, this is the cheapest answer — one string and one <code>&lt;span&gt;</code>. Watch whether the active row still reads as selected rather than hovered, and whether a header that matches <code>COLLECTIONS</code> exactly makes Views look like a fifth facet group.'
        ],
        rail: [
          'B: Accent rail — <code>SHOW</code> label, 3px rail, bar dropped',
          'Selection becomes a leading rail plus bold, and the tinted background is removed entirely. This frees the bar to mean one thing everywhere else in the panel: <em>toggled on</em>. The rail is painted with <code>var(--navbar-active, var(--accent-overlay, var(--accent)))</code> — the chain the facet stylesheet already uses, so no new token is introduced. Switch to gruvbox_dark and watch what colour the rail actually becomes.'
        ],
        seg: [
          'C: Segmented control — no micro-label, bordered block, filled active cell',
          'Views stops being a list and becomes a <em>control</em>: one bordered, rounded block of four cells with a filled active cell, sitting above the labelled groups. Maximum structural separation, and no header string to translate. It deliberately paints from <code>var(--accent-overlay, var(--accent))</code> — skipping <code>--navbar-active</code> — so it has real chroma in all three themes. That is a new chain, which is its cost.'
        ],
        synth: [
          'D: Synthesis — C&rsquo;s segmented block + A&rsquo;s <code>VIEWS</code> header',
          'C answered <em>&ldquo;is this a different kind of control?&rdquo;</em> structurally but left the block unnamed; A answered <em>&ldquo;what is this section?&rdquo;</em> but left selection weak. D takes both. The question it opens is whether a micro-label <em>and</em> a bordered block is one decoration too many in a 204px column — and whether the header, matching <code>COLLECTIONS</code> exactly, pulls the block back toward looking like another facet group after C worked to separate it. It also re-adds the catalogue key C avoided.'
        ]
      };

      function panelHTML(v, st) {
        const views = VIEWS.map(
          ([val, lbl]) =>
            `<button class="row${st.view === val ? ' active' : ''}" data-view="${val}">${lbl}</button>`
        ).join('');

        const header =
          v === 'base' || v === 'synth'
            ? '<span class="sec-label"><span class="title">Views</span></span>'
            : v === 'rail'
              ? '<span class="sec-label"><span class="title">Show</span></span>'
              : '';

        const storeRows = STORES.map(([val, lbl]) => {
          const n = countFor(st, val);
          const on = st.stores.has(val);
          return `<button class="facet${on ? ' checked' : ''}" data-store="${val}" style="${n === 0 && !on ? 'opacity:.38' : ''}">
            <span class="box">✓</span><span class="lbl">${lbl}</span><span class="ct">${n}</span>
          </button>`;
        }).join('');

        const grp = (key, title, body, badge) => `
          <div class="grp">
            <button class="grp-label${st.collapsed[key] ? ' collapsed' : ''}" data-grp="${key}">
              <span class="title">${title}</span>
              ${badge ? `<span class="badge">${badge}</span>` : ''}
              <span class="caret">▼</span>
            </button>
            <div class="grp-body${st.collapsed[key] ? ' collapsed' : ''}">${body}</div>
          </div>`;

        return `
          <div class="panel">
            <div class="search"><span>⌕</span><input placeholder="Search…" /></div>
            ${header}
            <div class="views">${views}</div>
            ${grp(
              'coll',
              'Collections',
              `<button class="row${st.coll === 'roguelikes' ? ' active' : ''}" data-coll="roguelikes">Roguelikes</button>
               <button class="row${st.coll === 'couch' ? ' active' : ''}" data-coll="couch">Couch co-op</button>
               <button class="row${st.coll === 'uncat' ? ' active' : ''}" data-coll="uncat">Uncategorized</button>
               <button class="row">+ New collection</button>`,
              st.coll ? 1 : 0
            )}
            ${grp('store', 'Store', storeRows, st.stores.size)}
            ${grp(
              'run',
              'Runnability',
              `<button class="facet"><span class="box">✓</span><span class="lbl">Playable on this Mac</span><span class="ct">11</span></button>
               <button class="facet"><span class="box">✓</span><span class="lbl">Native</span><span class="ct">4</span></button>`,
              0
            )}
            ${grp(
              'more',
              'More filters',
              `<button class="facet"><span class="box">✓</span><span class="lbl">Hidden games</span><span class="ct">2</span></button>`,
              0
            )}
          </div>`;
      }

      function mainHTML(st) {
        const games = filtered(st);
        const chips = [];
        if (st.view !== 'all')
          chips.push(VIEWS.find(([k]) => k === st.view)[1]);
        st.stores.forEach((s) =>
          chips.push(STORES.find(([k]) => k === s)[1])
        );
        const chipHTML =
          chips.map((c) => `<span class="chip">${c} ✕</span>`).join('') +
          (chips.length > 1 ? '<span class="chip clear">Clear all</span>' : '');

        return `
          <div class="main">
            <div class="chiprow">${chipHTML}</div>
            <div class="countline">${
              chips.length
                ? `${games.length} of ${LIB.length} games`
                : `${LIB.length} games`
            }</div>
            ${
              games.length
                ? `<div class="grid">${games
                    .map(
                      (g) =>
                        `<div class="card"><div class="art">${g.store}</div><div class="nm">${g.name}</div></div>`
                    )
                    .join('')}</div>`
                : `<div class="zero">No games match these filters.<br /><br /><span class="chip clear">Clear all filters</span></div>`
            }
          </div>`;
      }

      const MEASURE = `
        <div class="measure">
          <b>What the tokens actually resolve to in the selected theme</b> —
          read these with the panel, not instead of it.
          <div class="swatches">
            <span class="sw"><i style="background:var(--navbar-active-background)"></i><code>--navbar-active-background</code> · the bar · <b>11/11 themes</b></span>
            <span class="sw"><i style="background:var(--navbar-active,var(--accent-overlay,var(--accent)))"></i><code>--navbar-active</code> chain · active text + B's rail · <b>4/11 declare it</b></span>
            <span class="sw"><i style="background:var(--navbar-accent)"></i><code>--navbar-accent</code> · <em>inactive</em> row text</span>
            <span class="sw"><i style="background:var(--accent-overlay,var(--accent))"></i><code>--accent-overlay</code> chain · C's fill</span>
          </div>
          In <b>gruvbox_dark</b> swatch 2 and swatch 3 are the same colour
          (<code>#f9f5d7</code>) — the shipped active row differs from an
          inactive one by the grey bar and by nothing else.
        </div>`;

      function render(v) {
        const st = state[v];
        const [title, body] = BLURB[v];
        document.getElementById('variant-' + v).innerHTML =
          `<div class="vhead"><h1>${title}</h1><p>${body}</p></div>
           <div class="shell v-${v === 'base' ? 'base' : v === 'rail' ? 'rail' : 'seg'}">
             ${panelHTML(v, st)}${mainHTML(st)}
           </div>
           ${MEASURE}`;
        wire(v);
      }

      function wire(v) {
        const root = document.getElementById('variant-' + v);
        const st = state[v];
        root.querySelectorAll('[data-view]').forEach((el) =>
          el.addEventListener('click', () => {
            st.view = el.dataset.view; // idempotent: Views has no off state
            render(v);
          })
        );
        root.querySelectorAll('[data-coll]').forEach((el) =>
          el.addEventListener('click', () => {
            st.coll = st.coll === el.dataset.coll ? null : el.dataset.coll;
            render(v);
          })
        );
        root.querySelectorAll('[data-store]').forEach((el) =>
          el.addEventListener('click', () => {
            const s = el.dataset.store;
            st.stores.has(s) ? st.stores.delete(s) : st.stores.add(s);
            render(v);
          })
        );
        root.querySelectorAll('[data-grp]').forEach((el) =>
          el.addEventListener('click', () => {
            st.collapsed[el.dataset.grp] = !st.collapsed[el.dataset.grp];
            render(v);
          })
        );
        root.querySelectorAll('.chip').forEach((el) =>
          el.addEventListener('click', () => {
            st.view = 'all';
            st.stores.clear();
            render(v);
          })
        );
      }

      /* `synth` intentionally falls through the shell-class ternary above to
         'v-seg' — D reuses C's stylesheet rather than getting a class of its
         own, so the two cannot diverge on anything but the header. */
      ['base', 'rail', 'seg', 'synth'].forEach(render);

      document.querySelectorAll('.variant-tab').forEach((tab) =>
        tab.addEventListener('click', () => {
          document
            .querySelectorAll('.variant-tab')
            .forEach((t) => t.classList.toggle('active', t === tab));
          document
            .querySelectorAll('.variant')
            .forEach((s) => (s.hidden = s.id !== 'variant-' + tab.dataset.v));
        })
      );

      document.getElementById('theme').addEventListener('change', (e) => {
        document.querySelector('link[href*=themes]').href =
          '../themes/' + e.target.value + '.css';
      });
      document
        .getElementById('annotate')
        .addEventListener('click', () =>
          document.body.classList.toggle('annotate')
        );
    </script>
  </body>
</html>
